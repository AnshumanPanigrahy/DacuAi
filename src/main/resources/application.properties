spring.application.name=DocuMindAI

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
documind.pdf.storage-dir=${user.home}/.documind/pdfs

spring.datasource.url=jdbc:postgresql://localhost:5433/documind
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
documind.summarization.input-character-budget=12000
documind.summarization.output-character-allowance=2000
documind.summarization.output-token-limit=500
documind.summarization.request-timeout-millis=120000
documind.summarization.maximum-retries-per-key=2
documind.summarization.retry-initial-delay-millis=500
documind.summarization.retry-maximum-delay-millis=5000
documind.summarization.maximum-duration-millis=120000
documind.summarization.maximum-gemini-calls=100
documind.summarization.maximum-reduction-depth=8
documind.summarization.minimum-progress-ratio=0.05
documind.summarization.worker.core-pool-size=1
documind.summarization.worker.maximum-pool-size=2
documind.summarization.worker.queue-capacity=4
documind.summarization.worker.poll-delay-millis=1000
documind.summarization.worker.lease-millis=300000
documind.summarization.worker.batch-chunk-character-budget=10000
documind.summarization.worker.chunk-page-size=250
documind.summarization.worker.maximum-batch-attempts=3